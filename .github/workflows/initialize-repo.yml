name: Auto Initialize New Repository

on:
  repository_dispatch:
    types:
      - repository_created
  workflow_dispatch:
    inputs:
      repo_name:
        description: 'Nombre del repositorio (para ejecuciones manuales)'
        required: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Org Templates
        uses: actions/checkout@v4

      - name: Inject Template Files & Create Branches
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ORG_ADMIN_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            // Captura el nombre enviado automáticamente desde la Cloud Function o de forma manual
            const repo = context.payload.client_payload?.repository || context.inputs?.repo_name;
            const owner = context.payload.client_payload?.organization || 'Camanchaca';
            const defaultBranch = 'main';
            const templatesDir = 'templates';

            if (!repo) {
              core.setFailed("No se proporcionó el nombre del repositorio objetivo.");
              return;
            }

            console.log(`Inicializando repositorio: ${owner}/${repo}`);

            // Función recursiva para obtener todos los archivos dentro de un directorio
            function getAllFiles(dirPath, arrayOfFiles = []) {
              if (!fs.existsSync(dirPath)) {
                return arrayOfFiles;
              }
              const entries = fs.readdirSync(dirPath, { withFileTypes: true });

              for (const entry of entries) {
                const fullPath = path.join(dirPath, entry.name);
                if (entry.isDirectory()) {
                  arrayOfFiles = getAllFiles(fullPath, arrayOfFiles);
                } else if (entry.isFile()) {
                  arrayOfFiles.push(fullPath);
                }
              }
              return arrayOfFiles;
            }

            // Función para crear un archivo en el repositorio si no existe
            async function createIfNotExists(targetPath, templateFilePath) {
              try {
                await github.rest.repos.getContent({ owner, repo, path: targetPath });
                console.log(`El archivo '${targetPath}' ya existe en ${owner}/${repo}. Omitiendo...`);
              } catch (e) {
                let content = '';
                if (fs.existsSync(templateFilePath)) {
                  content = fs.readFileSync(templateFilePath, 'utf8');
                  content = content.replace(/{{REPO_NAME}}/g, repo);
                }

                await github.rest.repos.createOrUpdateFileContents({
                  owner,
                  repo,
                  path: targetPath,
                  message: `chore: add template ${targetPath}`,
                  content: Buffer.from(content).toString('base64'),
                  branch: defaultBranch
                });
                console.log(`Archivo '${targetPath}' creado correctamente.`);
              }
            }

            // 1. Obtener dinámicamente e inyectar todos los archivos de la carpeta templates/
            const templateFiles = getAllFiles(templatesDir);
            console.log(`Se encontraron ${templateFiles.length} archivos de plantilla en '${templatesDir}'.`);

            for (const filePath of templateFiles) {
              // Convertir la ruta local a ruta relativa del repositorio con separadores POSIX (/)
              const relativePath = path.relative(templatesDir, filePath).replace(/\\/g, '/');
              await createIfNotExists(relativePath, filePath);
            }

            // 2. Crear ramas develop y qas desde la rama principal (main)
            try {
              const mainRef = await github.rest.git.getRef({ owner, repo, ref: `heads/${defaultBranch}` });
              const mainSha = mainRef.data.object.sha;

              async function createBranch(branchName) {
                try {
                  await github.rest.git.createRef({
                    owner,
                    repo,
                    ref: `refs/heads/${branchName}`,
                    sha: mainSha
                  });
                  console.log(`Rama '${branchName}' creada correctamente.`);
                } catch (err) {
                  console.log(`No se pudo crear la rama '${branchName}':`, err.message);
                }
              }

              await createBranch('develop');
              await createBranch('qas');

            } catch (err) {
              core.setFailed(`Error al acceder o configurar ramas en el repo '${repo}': ${err.message}`);
            }